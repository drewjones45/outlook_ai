[project]
name = "outlook-ai"
version = "0.1.0"
description = "Read mail and calendar from classic Outlook for Mac via AppleScript and hand it to Claude (MCP server + CLI). Drafts only, never sends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "icalendar>=5.0",
    "recurring-ical-events>=2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
outlook-ai = "outlook_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outlook_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
